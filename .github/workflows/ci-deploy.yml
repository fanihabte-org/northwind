name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: northwind-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Generate deterministic CI seed
        run: >
          python generator/generate.py --scale 0.05 --format parquet
          --seed 20260728
      - run: python -m pytest
      - name: Validate Compose configuration
        env:
          FAKEFORCE_EXPORTS_DIR: ${{ runner.temp }}/fakeforce-exports
          SIMULATION_BASELINE_DATE: 2026-07-24
        run: |
          mkdir -p "$FAKEFORCE_EXPORTS_DIR"
          docker compose config --quiet

  source-integration:
    name: Source integration
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Generate small deterministic source seed
        run: >
          python generator/generate.py --scale 0.05 --format parquet
          --seed 20260728
      - name: Validate source migrations, load, and daily reconciliation
        run: bash scripts/ci-source-integration.sh

  deploy:
    name: Deploy Northwind
    needs: [test, source-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The production runner is faniel-habte-PowerEdge-T430 (Linux x64).
    runs-on: [self-hosted, Linux, X64]
    environment: production
    steps:
      - name: Update trusted checkout and restart services
        env:
          DEPLOY_DIR: ${{ vars.NORTHWIND_DEPLOY_DIR }}
          FAKEFORCE_EXPORTS_DIR: ${{ vars.NORTHWIND_EXPORTS_DIR }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Every precondition below used to be a bare silent command under
          # `set -e`: test -d, both diff --quiet, and cat-file -e all exit 1
          # without printing anything. A failure was therefore indistinguishable
          # from any other, and reported only as "exit code 1" after ~5s.
          fail() { echo "::error::deploy precondition failed: $*"; exit 1; }

          : "${DEPLOY_DIR:?Set the NORTHWIND_DEPLOY_DIR repository variable}"
          : "${FAKEFORCE_EXPORTS_DIR:?Set the NORTHWIND_EXPORTS_DIR repository variable}"

          test -d "$DEPLOY_DIR/.git" \
            || fail "$DEPLOY_DIR is not a git checkout"

          if ! git -C "$DEPLOY_DIR" diff --quiet; then
            git -C "$DEPLOY_DIR" diff --stat
            fail "the deployment checkout has uncommitted changes; deploying would discard them"
          fi
          if ! git -C "$DEPLOY_DIR" diff --cached --quiet; then
            git -C "$DEPLOY_DIR" diff --cached --stat
            fail "the deployment checkout has staged changes; deploying would discard them"
          fi

          git -C "$DEPLOY_DIR" fetch --prune origin \
            || fail "could not fetch from the deployment checkout's origin"

          if ! git -C "$DEPLOY_DIR" cat-file -e "$EXPECTED_SHA^{commit}" 2>/dev/null; then
            echo "deployment checkout origin : $(git -C "$DEPLOY_DIR" remote get-url origin)"
            echo "workflow repository        : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "commit being deployed      : $EXPECTED_SHA"
            fail "commit is absent from the deployment checkout after fetching -- the runner's origin and the repository this workflow runs in are probably not the same repository"
          fi

          git -C "$DEPLOY_DIR" checkout --detach "$EXPECTED_SHA" \
            || fail "could not check out $EXPECTED_SHA"
          mkdir -p "$FAKEFORCE_EXPORTS_DIR"
          export FAKEFORCE_EXPORTS_DIR
          # Build and run migrations explicitly. A previously successful one-shot
          # container otherwise satisfies Compose's dependency condition without
          # applying migrations added by this deployment.
          docker compose --project-directory "$DEPLOY_DIR" build migrations fakeforce simulator
          docker compose --project-directory "$DEPLOY_DIR" run --rm migrations
          docker compose --project-directory "$DEPLOY_DIR" up -d fakeforce simulator
          for attempt in $(seq 1 24); do
            if docker compose --project-directory "$DEPLOY_DIR" exec -T fakeforce python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
