name: Read-only performance

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Deterministic generator scale to benchmark"
        required: true
        default: "0.3"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAKEFORCE_EXPORTS_DIR: ${{ runner.temp }}/fakeforce-exports
      FAKEFORCE_STATE_DIR: ${{ runner.temp }}/fakeforce-state
      FAKEFORCE_MEMORY_LIMIT: 2GB
      FAKEFORCE_PAGE_SIZE: "50000"
      FAKEFORCE_RATE_LIMIT: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Generate and profile deterministic benchmark seed
        run: |
          python generator/generate.py --scale "${{ inputs.scale }}" --format parquet --seed 20260728
          python -m generator.profile --output performance-profile.json
      - name: Start read-only API
        run: |
          mkdir -p "$FAKEFORCE_EXPORTS_DIR" "$FAKEFORCE_STATE_DIR"
          docker compose up -d --build fakeforce
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:8080/health && exit 0
            sleep 5
          done
          docker compose logs --no-color fakeforce
          exit 1
      - name: Measure REST and Bulk Query
        env:
          PERF_OUTPUT: performance-report.json
        run: python scripts/read_only_performance_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-only-performance-${{ inputs.scale }}
          path: |
            performance-profile.json
            performance-report.json
      - if: always()
        run: docker compose down --volumes --remove-orphans
